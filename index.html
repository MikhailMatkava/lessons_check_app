<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>Мои занятия</title>
  <style>
    :root{--ink:#17191f;--muted:#7c7f8c;--line:#e8e9ef;--card:#fff;--bg:#f5f6fa;--purple:#6557e8;--green:#18a46b;--yellow:#f5b93d;--red:#e15b64}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    button,input,select{font:inherit}.app{max-width:540px;min-height:100vh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px}h1{font-size:28px;letter-spacing:-.7px;margin:0}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#e9e6ff;color:var(--purple);font-weight:750}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 6px 22px #2525450a}.stat small{color:var(--muted);font-size:13px}.stat strong{display:block;margin-top:4px;font-size:22px;letter-spacing:-.4px}.debt strong{color:var(--red)}
    .calendar{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 8px 28px #2525450a}.cal-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}.cal-head strong{font-size:18px}.nav{display:flex;gap:6px}.icon{border:0;background:#f1f1f6;width:36px;height:36px;border-radius:12px;color:#4a4b55;font-size:21px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;color:#9a9ca6;font-size:12px;font-weight:650;padding-bottom:7px}.day{position:relative;aspect-ratio:1;border:0;background:transparent;border-radius:13px;color:var(--ink);display:flex;align-items:flex-start;justify-content:center;padding-top:7px;font-size:14px}.day.other{color:#c4c5cc}.day.today{box-shadow:inset 0 0 0 1.5px var(--purple)}.day.selected{background:var(--purple);color:white;font-weight:700}.dots{position:absolute;bottom:6px;display:flex;gap:2px}.dot{width:4px;height:4px;border-radius:50%;background:var(--green)}.dot.unpaid{background:var(--yellow)}.selected .dot{box-shadow:0 0 0 1px #ffffff77}
    .section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 3px 10px}.section-title h2{font-size:19px;margin:0}.section-title span{font-size:13px;color:var(--muted)}.lesson{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:9px}.badge{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#e9f8f1;color:var(--green);font-weight:750}.lesson.unpaid .badge{background:#fff4d9;color:#b67b06}.lesson h3{margin:0 0 3px;font-size:16px}.meta{font-size:13px;color:var(--muted)}.price{text-align:right;font-weight:700}.status{display:block;border:0;margin-top:4px;padding:3px 7px;border-radius:8px;font-size:11px;background:#e9f8f1;color:var(--green)}.unpaid .status{background:#fff1cf;color:#9a6500}.empty{text-align:center;color:var(--muted);background:#fff;border:1px dashed #d8d9e1;border-radius:18px;padding:24px}
    .fab{position:fixed;right:max(20px,calc((100vw - 540px)/2 + 20px));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:20px;background:var(--purple);color:#fff;font-size:30px;box-shadow:0 12px 28px #6557e84d}
    dialog{border:0;border-radius:26px 26px 0 0;padding:0;width:min(540px,100%);max-width:none;margin:auto auto 0;background:#fff}dialog::backdrop{background:#15151d66;backdrop-filter:blur(2px)}.sheet{padding:12px 20px calc(24px + env(safe-area-inset-bottom))}.handle{width:38px;height:5px;border-radius:9px;background:#ddd;margin:0 auto 18px}.sheet h2{margin:0 0 17px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #dfe0e7;border-radius:14px;padding:13px;background:#f9f9fb;color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:9px;margin:16px 2px}.check input{width:21px;height:21px;accent-color:var(--green)}.actions{display:flex;gap:9px}.actions button{border:0;border-radius:14px;padding:13px 16px;font-weight:650}.save{flex:1;background:var(--purple);color:white}.cancel{background:#eeeef3}.delete{background:#fff0f1;color:var(--red)}
    @media(min-width:700px){.app{padding-top:30px}.fab{right:calc((100vw - 540px)/2 + 20px)}}
  </style>
</head>
<body><main class="app">
  <header><div><div style="color:var(--muted);font-size:13px">Личный календарь</div><h1>Мои занятия</h1></div><div class="avatar">У</div></header>
  <section class="stats"><div class="stat"><small>Оплачено за месяц</small><strong id="paidTotal">0 ₽</strong></div><div class="stat debt"><small>Должны</small><strong id="debtTotal">0 ₽</strong></div></section>
  <section class="calendar"><div class="cal-head"><strong id="monthTitle"></strong><div class="nav"><button class="icon" id="prev" aria-label="Предыдущий месяц">‹</button><button class="icon" id="next" aria-label="Следующий месяц">›</button></div></div><div class="week"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div><div class="grid" id="grid"></div></section>
  <div class="section-title"><h2 id="dayTitle">Занятия</h2><span id="lessonCount"></span></div><section id="lessons"></section>
  <button class="fab" id="add" aria-label="Добавить занятие">+</button>
</main>
<dialog id="dialog"><form class="sheet" id="form"><div class="handle"></div><h2 id="formTitle">Новое занятие</h2><input type="hidden" id="editId"><div class="field"><label for="student">Ученик</label><select id="student"><option value="Ученик">Ученик</option></select></div><div class="row"><div class="field"><label for="date">Дата</label><input id="date" type="date" required></div><div class="field"><label for="time">Время</label><input id="time" type="time" value="17:00" required></div></div><div class="field"><label for="price">Стоимость, ₽</label><input id="price" type="number" min="0" step="100" required></div><label class="check"><input id="paid" type="checkbox"> Оплачено</label><div class="actions"><button type="button" class="delete" id="delete" hidden>Удалить</button><button type="button" class="cancel" id="cancel">Отмена</button><button class="save">Сохранить</button></div></form></dialog>
<script>
const tariffs={"Ученик":2000};
const seed=[];
let data=JSON.parse(localStorage.getItem('lessonTrackerData')||'null')||seed;
let now=new Date(), view=new Date(now.getFullYear(),now.getMonth(),1), selected=now.toISOString().slice(0,10);
const $=id=>document.getElementById(id), months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'], monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const rub=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽'; const save=()=>localStorage.setItem('lessonTrackerData',JSON.stringify(data));
function render(){
 const y=view.getFullYear(),m=view.getMonth(); $('monthTitle').textContent=monthNames[m]+' '+y; $('grid').innerHTML='';
 const first=new Date(y,m,1),start=(first.getDay()+6)%7; for(let i=0;i<42;i++){const d=new Date(y,m,1-start+i),key=iso(d),items=data.filter(x=>x.date===key);const b=document.createElement('button');b.className='day'+(d.getMonth()!=m?' other':'')+(key===selected?' selected':'')+(key===iso(new Date())?' today':'');b.innerHTML=`<span>${d.getDate()}</span>${items.length?`<span class="dots">${items.slice(0,3).map(x=>`<i class="dot ${x.paid?'':'unpaid'}"></i>`).join('')}</span>`:''}`;b.onclick=()=>{selected=key;view=new Date(d.getFullYear(),d.getMonth(),1);render()};$('grid').appendChild(b)}
 const monthItems=data.filter(x=>x.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));$('paidTotal').textContent=rub(monthItems.filter(x=>x.paid).reduce((a,x)=>a+x.price,0));$('debtTotal').textContent=rub(data.filter(x=>!x.paid&&x.date<=iso(new Date())).reduce((a,x)=>a+x.price,0));
 const ds=new Date(selected+'T12:00:00'),items=data.filter(x=>x.date===selected).sort((a,b)=>a.time.localeCompare(b.time));$('dayTitle').textContent=`${ds.getDate()} ${months[ds.getMonth()]}`;$('lessonCount').textContent=items.length?items.length+' '+(items.length===1?'занятие':'занятия'):'';$('lessons').innerHTML=items.length?'':`<div class="empty">На этот день занятий нет</div>`;
 items.forEach(x=>{const el=document.createElement('article');el.className='lesson '+(x.paid?'':'unpaid');el.innerHTML=`<div class="badge">${x.student[0]}</div><div><h3>${x.student}</h3><div class="meta">${x.time} · ${x.date>iso(new Date())?'Запланировано':'Проведено'}</div></div><div class="price">${rub(x.price)}<button class="status">${x.paid?'Оплачено':'Не оплачено'}</button></div>`;el.querySelector('.status').onclick=e=>{e.stopPropagation();x.paid=!x.paid;save();render()};el.onclick=()=>openForm(x);$('lessons').appendChild(el)})
}
function openForm(x){$('form').reset();$('date').value=x?.date||selected;$('time').value=x?.time||'17:00';$('student').value=x?.student||'Ученик';$('price').value=x?.price||tariffs[$('student').value];$('paid').checked=!!x?.paid;$('editId').value=x?.id||'';$('delete').hidden=!x;$('formTitle').textContent=x?'Изменить занятие':'Новое занятие';$('dialog').showModal()}
$('student').onchange=()=>$('price').value=tariffs[$('student').value];$('add').onclick=()=>openForm();$('cancel').onclick=()=>$('dialog').close();$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);selected=iso(view);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);selected=iso(view);render()};
$('form').onsubmit=e=>{e.preventDefault();const id=$('editId').value,obj={id:id||crypto.randomUUID(),student:$('student').value,date:$('date').value,time:$('time').value,price:Number($('price').value),paid:$('paid').checked};if(id)data[data.findIndex(x=>x.id===id)]=obj;else data.push(obj);selected=obj.date;view=new Date(obj.date+'T12:00:00');save();$('dialog').close();render()};$('delete').onclick=()=>{data=data.filter(x=>x.id!==$('editId').value);save();$('dialog').close();render()};render();
</script></body></html>
